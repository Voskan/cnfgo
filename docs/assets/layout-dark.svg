<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 236" width="860" height="236" role="img" aria-label="Go pointer heap compared with cnfgo flat tables">
  <defs>
    <marker id="arrow-ptr-dark" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#f85149"/>
    </marker>
    <marker id="arrow-off-dark" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Left: Ordinary Go heap -->
  <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Go heap: map[uint64]*Item</text>
  <text x="16" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">Separate heap objects; GC follows every pointer</text>

  <rect x="16" y="88" width="96" height="52" rx="3" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="64" y="110" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#e6edf3">hmap</text>
  <text x="64" y="127" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8b949e">buckets</text>

  <rect x="148" y="80" width="102" height="68" rx="3" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="199" y="103" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#e6edf3">*Item</text>
  <text x="199" y="121" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8b949e">string, []Tag</text>
  <text x="199" y="137" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8b949e">map, *Seller</text>

  <rect x="292" y="62" width="96" height="28" rx="3" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="340" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#e6edf3">"sku-04..."</text>

  <rect x="292" y="100" width="96" height="28" rx="3" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="340" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#e6edf3">[]Tag / map</text>

  <rect x="292" y="138" width="96" height="28" rx="3" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="340" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#e6edf3">*Seller</text>

  <line x1="112" y1="114" x2="144" y2="114" stroke="#f85149" stroke-width="1.25" marker-end="url(#arrow-ptr-dark)"/>
  <line x1="250" y1="98" x2="288" y2="77" stroke="#f85149" stroke-width="1.25" marker-end="url(#arrow-ptr-dark)"/>
  <line x1="250" y1="114" x2="288" y2="114" stroke="#f85149" stroke-width="1.25" marker-end="url(#arrow-ptr-dark)"/>
  <line x1="250" y1="130" x2="288" y2="151" stroke="#f85149" stroke-width="1.25" marker-end="url(#arrow-ptr-dark)"/>

  <text x="16" y="208" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">PtrBytes &gt; 0  (471 MiB scanned at 1M items)</text>

  <!-- Center divider -->
  <line x1="420" y1="14" x2="420" y2="218" stroke="#21262d" stroke-width="1"/>

  <!-- Right: cnfgo contiguous layout -->
  <text x="448" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">cnfgo: flat tables + string blob</text>
  <text x="448" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">Contiguous noscan slices; 32-bit indices and spans</text>

  <text x="448" y="76" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b949e">[]flatItem</text>
  <rect x="448" y="84" width="388" height="34" rx="3" fill="#121d2f" stroke="#388bfd" stroke-width="1"/>
  <line x1="545" y1="84" x2="545" y2="118" stroke="#388bfd" stroke-width="1"/>
  <line x1="642" y1="84" x2="642" y2="118" stroke="#388bfd" stroke-width="1"/>
  <line x1="739" y1="84" x2="739" y2="118" stroke="#388bfd" stroke-width="1"/>
