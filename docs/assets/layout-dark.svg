  <text x="690" y="105" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#e6edf3">Item[2]</text>
  <text x="787" y="105" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">...</text>

  <text x="448" y="143" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b949e">strBlob</text>
  <rect x="448" y="150" width="388" height="30" rx="3" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <line x1="556" y1="150" x2="556" y2="180" stroke="#30363d" stroke-width="1"/>
  <line x1="650" y1="150" x2="650" y2="180" stroke="#30363d" stroke-width="1"/>
  <line x1="756" y1="150" x2="756" y2="180" stroke="#30363d" stroke-width="1"/>
  <text x="502" y="169" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#e6edf3">"sku-04..."</text>
  <text x="603" y="169" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#e6edf3">"seller-a"</text>
  <text x="703" y="169" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#e6edf3">"us-east"</text>
  <text x="796" y="169" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b949e">...</text>

  <!-- Offset reference arrow from Item[0] to strBlob -->
  <path d="M518,118 L518,146" fill="none" stroke="#58a6ff" stroke-width="1.25" marker-end="url(#arrow-off-dark)"/>
  <text x="525" y="137" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#58a6ff">(off, len)</text>

  <text x="448" y="208" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#58a6ff">PtrBytes == 0  (0 MiB scanned; mmap-ready)</text>
</svg>
